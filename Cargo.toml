[package]
name = "grimmdev-redb-native-bindings"
version = "0.1.0"
edition = "2021"
description = "General-purpose, disk-backed redb key-value database compiled as an async N-API native addon for Node.js and Bun"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi8", "async", "tokio_rt"] }
napi-derive = "2.16"
redb = "2.4"

[build-dependencies]
napi-build = "2.1"

[dev-dependencies]
tempfile = "3.13"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
opt-level = 3
