name: Release to GitHub Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npm run build -- --target x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
            build: npm run build -- --target x86_64-unknown-linux-musl
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            setup: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
            env_cc: aarch64-linux-gnu-gcc
            build: npm run build -- --target aarch64-unknown-linux-gnu
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npm run build -- --target aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npm run build -- --target x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: npm run build -- --target x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cross-compile dependencies
        if: matrix.settings.setup
        run: ${{ matrix.settings.setup }}

      - name: Install Node dependencies
        run: npm install

      - name: Build native binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.settings.env_cc }}
        run: ${{ matrix.settings.build }}

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            *.node
            index.js
            index.d.ts
          if-no-files-found: error

  publish:
    name: Publish @grimmdev/redb-native-bindings
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@grimmdev"

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install Node dependencies
        run: npm install

      - name: Assemble and publish packages to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const rootPkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            rootPkg.optionalDependencies = rootPkg.optionalDependencies || {};

            function walk(dir) {
              let files = [];
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) files = files.concat(walk(full));
                else files.push(full);
              }
              return files;
            }

            const allFiles = walk("artifacts");
            const indexJs = allFiles.find((f) => path.basename(f) === "index.js");
            if (!indexJs) throw new Error("index.js not found in artifacts");
            fs.copyFileSync(indexJs, "index.js");

            const nodeFiles = allFiles.filter((f) => f.endsWith(".node"));
            if (nodeFiles.length === 0) throw new Error("No .node binaries found in artifacts");

            for (const file of nodeFiles) {
              const base = path.basename(file);
              const match = base.match(/^.+\.([^.]+)\.node$/);
              if (!match) continue;
              const triplet = match[1];
              const [osName, cpuName, abi] = triplet.split("-");

              const pkgDir = path.join("npm", triplet);
              fs.mkdirSync(pkgDir, { recursive: true });
              fs.copyFileSync(file, path.join(pkgDir, base));

              const subPkg = {
                name: `${rootPkg.name}-${triplet}`,
                version: rootPkg.version,
                os: [osName],
                cpu: [cpuName],
                ...(abi === "gnu" ? { libc: ["glibc"] } : abi === "musl" ? { libc: ["musl"] } : {}),
                main: base,
                files: [base],
                license: rootPkg.license || "MIT",
                repository: rootPkg.repository,
                publishConfig: { registry: "https://npm.pkg.github.com" },
              };

              fs.writeFileSync(path.join(pkgDir, "package.json"), JSON.stringify(subPkg, null, 2));
              rootPkg.optionalDependencies[subPkg.name] = subPkg.version;
            }

            fs.writeFileSync("package.json", JSON.stringify(rootPkg, null, 2));
          '
          for pkg in npm/*; do
            if [ -f "$pkg/package.json" ]; then
              npm publish "$pkg" || true
            fi
          done
          npm publish --ignore-scripts
